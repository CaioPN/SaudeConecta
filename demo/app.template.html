// Escapa o texto que entra no HTML. Todo dado exibido passa por aqui.
function esc(valor) {
  if (valor === null || valor === undefined) return '';
  return String(valor)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Idade em anos completos a partir de uma data ISO.
function calcularIdade(dataIso) {
  if (!dataIso) return null;
  const nasc = new Date(dataIso + 'T00:00:00');
  if (Number.isNaN(nasc.getTime())) return null;
  const hoje = new Date();
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const m = hoje.getMonth() - nasc.getMonth();
  if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
  return idade;
}

function formatarDataBR(data) {
  if (!data) return '—';
  const m = String(data).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : data;
}

function formatarCPF(cpf) {
  const d = String(cpf || '').replace(/\D/g, '');
  return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : (cpf || '—');
}

function formatarTelefone(tel) {
  const d = String(tel || '').replace(/\D/g, '');
  if (d.length === 11) return d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
  if (d.length === 10) return d.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3');
  return tel || '—';
}

function formatarCEP(cep) {
  const d = String(cep || '').replace(/\D/g, '');
  return d.length === 8 ? d.replace(/(\d{5})(\d{3})/, '$1-$2') : (cep || '—');
}

// "12/03/2026 às 14:30" — usado no histórico de acessos.
function dataHoraLonga(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
    ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

// "14/07 11:00" — usado na lista de acessos concedidos.
function dataHoraCurta(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? iso
    : d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

// Aviso do que só existe no app completo (baixar PDF, ligar, abrir o mapa).
let toastTimer = null;
function avisar(texto) {
  const anterior = document.querySelector('.demo-toast');
  if (anterior) anterior.remove();
  const caixa = document.createElement('div');
  caixa.className = 'demo-toast';
  caixa.setAttribute('role', 'status');
  caixa.textContent = texto;
  document.body.appendChild(caixa);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { caixa.remove(); }, 4000);
}

// --- Carteira de Vacinação ---
function classePorGenero(pessoa) {
  if (pessoa.titular) return '';
  const genero = (pessoa.genero || '').trim().toLowerCase();
  if (genero === 'masculino') return 'menino';
  if (genero === 'feminino') return 'menina';
  return '';
}

function itemVacina(v) {
  const tomada = v.status === 'tomada';
  return '<div class="vacina-item ' + v.status + '">' +
    '<div class="vacina-status-icon ' + v.status + '">' + ic(tomada ? 'check' : 'clock', 16) + '</div>' +
    '<div class="vacina-info">' +
      '<div class="vacina-top"><span class="vacina-nome">' + esc(v.vacina) + '</span>' +
      '<span class="vacina-periodo">' + esc(v.periodo) + '</span></div>' +
      '<span class="vacina-dose">' + esc(v.dose) + '</span>' +
      (v.protege ? '<span class="vacina-protege">Protege contra: ' + esc(v.protege) + '</span>' : '') +
      '<span class="vacina-data">' +
      (tomada
        ? (v.dataPrevista ? 'Aplicada em ' + esc(v.dataPrevista) : 'Aplicada — em dia')
        : 'Prevista para ' + esc(v.dataPrevista)) +
      '</span>' +
    '</div></div>';
}

function telaVacinas() {
  const pessoas = [{ id: 'titular', nome: PACIENTE.nome, data_nascimento: PACIENTE.data_nascimento, titular: true }]
    .concat(estado.dependentes.map(function (d) {
      return { id: d.id, nome: d.nome, data_nascimento: d.data_nascimento, genero: d.genero, titular: false };
    }));

  const pessoa = pessoas.filter(function (p) { return String(p.id) === String(estado.pessoaVacina); })[0] || pessoas[0];
  const idade = calcularIdade(pessoa.data_nascimento);
  // O titular usa o calendário adulto; dependentes de até 12 anos, o infantil.
  const adulto = pessoa.titular || (idade != null && idade >= 13);
  const carteira = montarCarteira(pessoa.data_nascimento, { adulto: adulto });

  const tomadas = carteira.filter(function (v) { return v.status === 'tomada'; });
  const pendentes = carteira.filter(function (v) { return v.status === 'pendente'; });
  const percentual = carteira.length ? Math.round((tomadas.length / carteira.length) * 100) : 0;

  const seletor = pessoas.map(function (p) {
    return '<button class="vacina-pessoa-pill' + (String(p.id) === String(pessoa.id) ? ' active' : '') + '" ' +
      'data-pessoa-vacina="' + p.id + '">' +
      '<span class="vacina-pessoa-icone ' + classePorGenero(p) + '">' + ic(p.titular ? 'user' : 'baby', 15) + '</span>' +
      esc(p.titular ? p.nome.split(' ')[0] + ' (você)' : p.nome.split(' ')[0]) + '</button>';
  }).join('');

  return '<div class="screen-container vacinas-screen">' +
    '<div class="vacinas-topo">' +
      botaoVoltar() +
      '<h2 class="header-title mb-2">Carteira de Vacinação</h2>' +
      '<p class="text-sm text-muted mb-6">Calendário Nacional de Vacinação (SUS)</p>' +
      '<div class="vacina-pessoa-selector">' + seletor + '</div>' +
      '<div class="card"><div class="vacina-resumo">' +
        '<div class="icon-box">' + ic('shieldCheck', 26) + '</div>' +
        '<div style="flex:1"><div class="flex justify-between items-center mb-2">' +
        '<span class="font-bold">' + (idade != null ? idade + (idade === 1 ? ' ano' : ' anos') : 'Titular da conta') + '</span>' +
        '<span class="text-sm text-muted">' + tomadas.length + ' de ' + carteira.length + ' em dia</span></div>' +
        '<div class="vacina-progress-bg"><div class="vacina-progress-fill" style="width:' + percentual + '%"></div></div>' +
        '</div></div></div>' +
    '</div>' +

    '<div class="vacinas-lista">' +
      (pendentes.length
        ? '<h3 class="section-title">Próximas doses</h3>' + pendentes.map(itemVacina).join('')
        : '') +
      '<h3 class="section-title" style="margin-top:' + (pendentes.length ? '24px' : '0') + '">' +
      (adulto ? 'Vacinas em dia' : 'Doses já aplicadas') + '</h3>' +
      tomadas.map(itemVacina).join('') +
    '</div></div>';
}

// --- Acesso do médico ---
const ROTULO_SITUACAO = {
  'aguardando': 'Aguardando o médico', 'em-uso': 'Em uso',
  'expirado': 'Expirado', 'revogado': 'Revogado',
};
// A cor do selo reaproveita os status já existentes.
const STATUS_BADGE_ACESSO = {
  'aguardando': 'agendada', 'em-uso': 'normal', 'expirado': 'pendente', 'revogado': 'alterado',
};

function situacaoAcesso(a) {
  if (a.revogadoEm) return 'revogado';
  if (new Date(a.expiraEm) <= new Date()) return 'expirado';
  return a.usadoEm ? 'em-uso' : 'aguardando';
}

// Minutos e segundos até `iso`; null quando já passou.
function tempoRestante(iso) {
  const ms = new Date(iso) - new Date();
  if (ms <= 0) return null;
  const total = Math.floor(ms / 1000);
  return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
}

function telaAcessoMedico() {
  const restante = estado.codigoNovo ? tempoRestante(estado.codigoNovo.expiraEm) : null;

  const cartaoCodigo = (estado.codigoNovo && restante)
    ? '<div class="card codigo-card">' +
        '<span class="codigo-label">Código do atendimento</span>' +
        '<strong class="codigo-valor">' + esc(estado.codigoNovo.codigo) + '</strong>' +
        '<div class="codigo-rodape">' +
          '<span class="codigo-timer">' + ic('clock', 14) + ' expira em <span id="timer-codigo">' + restante + '</span></span>' +
          '<button class="codigo-copiar" data-acao="copiar-codigo">' + ic('copy', 14) + ' Copiar</button>' +
        '</div>' +
        '<p class="codigo-aviso">Anote agora: por segurança o código não fica guardado e não pode ser consultado depois.</p>' +
      '</div>'
    : '';

  const lista = estado.acessos.length === 0
    ? '<p class="empty-state">Você ainda não concedeu nenhum acesso.</p>'
    : estado.acessos.map(function (a) {
        const situacao = situacaoAcesso(a);
        const ativo = situacao === 'aguardando' || situacao === 'em-uso';
        return '<div class="card acesso-item">' +
          '<div class="acesso-item-topo"><div>' +
            '<p class="font-bold">' + esc(a.medico || 'Ainda não utilizado') + '</p>' +
            '<p class="text-xs text-muted">' + (a.crm ? 'CRM ' + esc(a.crm) + ' · ' : '') +
            (a.escopo === 'escrita' ? 'Leitura e registro' : 'Somente leitura') + '</p>' +
          '</div>' + selo(STATUS_BADGE_ACESSO[situacao], ROTULO_SITUACAO[situacao]) + '</div>' +
          '<p class="text-xs text-muted">Gerado em ' + dataHoraCurta(a.criadoEm) +
          (a.usadoEm ? ' · usado em ' + dataHoraCurta(a.usadoEm) : '') +
          (a.revogadoEm ? ' · revogado em ' + dataHoraCurta(a.revogadoEm) : '') + '</p>' +
          (ativo ? '<button class="acesso-revogar" data-revogar="' + a.id + '">' +
            ic('ban', 14) + ' Revogar agora</button>' : '') +
        '</div>';
      }).join('');

  return '<div class="screen-container">' +
    botaoVoltar() +
    '<h2 class="header-title mb-2">Acesso do médico</h2>' +
    '<p class="text-sm text-muted mb-6">Gere um código e mostre ao profissional durante o atendimento. ' +
    'Ele usa o código no portal do médico para ver seu resumo clínico e registrar o que foi feito na consulta.</p>' +

    cartaoCodigo +

    '<h3 class="section-title">Novo acesso</h3>' +
    '<div class="escopo-opcoes">' +
      '<button class="escopo-opcao' + (estado.escopoAcesso === 'leitura' ? ' active' : '') + '" data-escopo="leitura">' +
      ic('bookOpen', 18) + '<span class="escopo-titulo">Somente leitura</span>' +
      '<span class="escopo-desc">O médico vê seu resumo clínico, mas não altera nada.</span></button>' +
      '<button class="escopo-opcao' + (estado.escopoAcesso === 'escrita' ? ' active' : '') + '" data-escopo="escrita">' +
      ic('penLine', 18) + '<span class="escopo-titulo">Leitura e registro</span>' +
      '<span class="escopo-desc">O médico também registra a consulta e os exames.</span></button>' +
    '</div>' +

    '<button class="btn-primary" data-acao="gerar-codigo">' + ic('keyRound', 18) + ' Gerar código</button>' +

    '<p class="acesso-nota">' + ic('shieldCheck', 14) +
    ' O código vale por 30 minutos, serve para um único médico e pode ser revogado a qualquer momento. ' +
    'Seu CPF, e-mail e endereço nunca são compartilhados.</p>' +

    '<h3 class="section-title" style="margin-top:24px">Acessos concedidos</h3>' + lista +
  '</div>';
}

/* --- Assistente virtual ---
   Só a camada local de regras. No app real, o que a base não conhece vai
   para o Gemini pelo backend; aqui não há servidor, então o assistente
   avisa em vez de fingir que consultou a IA. */
/* __CHATBOT_BASE__ */

// Tira acentos e caixa: o casamento não pode depender de "vacinação" vs "vacinacao".
function normalizar(texto) {
  return texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// Vence a entrada com MAIS palavras-chave presentes, não a primeira que casar.
function buscarNaBase(texto) {
  const t = normalizar(texto);
  let melhor = null;
  let melhorPontos = 0;
  BASE_CONHECIMENTO.forEach(function (entrada) {
    const pontos = entrada.chaves.filter(function (chave) { return t.indexOf(normalizar(chave)) !== -1; }).length;
    if (pontos > melhorPontos) { melhorPontos = pontos; melhor = entrada; }
  });
  return melhor ? melhor.resposta : null;
}

const RESPOSTA_FALLBACK =
  'Ainda não sei responder isso com certeza. 🤔 Posso ajudar com: agendar consultas, exames, ' +
  'dependentes, prontuário, senha/acesso e privacidade. (Nesta demonstração respondo só pela base ' +
  'de regras local — no app completo a pergunta seguiria para a IA.)';

function renderChatbot(rota) {
  const caixa = document.getElementById('chatbot');
  if (SEM_BARRA.indexOf(rota) !== -1) {
    caixa.hidden = true;
    caixa.innerHTML = '';
    return;

  caixa.hidden = false;

  if (!estado.chatAberto) {
    caixa.innerHTML = '<button class="chatbot-fab" data-acao="abrir-chat" aria-label="Abrir o assistente virtual">' +
      ic('messageCircle', 28) + '</button>';

  }

  const mensagens = estado.chatMensagens.map(function (m) {
    return '<div class="chat-message-row ' + m.de + '">' +
      '<div class="chat-bubble ' + m.de + '">' + esc(m.texto) + '</div></div>';
  }).join('');

  const digitando = estado.chatDigitando
    ? '<div class="chat-message-row bot"><div class="chat-bubble bot typing-indicator">' +
      '<span></span><span></span><span></span></div></div>'
    : '';

  const sugestoes = estado.chatMensagens.length === 1
    ? '<div class="chat-suggestions">' + SUGESTOES.map(function (s) {
        return '<button class="chat-suggestion-btn" data-sugestao="' + esc(s) + '">' + esc(s) + '</button>';
      }).join('') + '</div>'
    : '';

  caixa.innerHTML =
    '<div class="chat-window">' +
      '<div class="chat-header"><div class="chat-header-info">' +
        '<div class="chat-bot-icon">' + ic('bot', 20) + '</div>' +
        '<div class="chat-bot-status"><span class="chat-bot-name">Assistente Saúde Conecta</span>' +
        '<span class="chat-status-indicator"><span class="status-dot"></span>' +
        '<span class="status-text">Online</span></span></div>' +
      '</div>' +
      '<button class="chat-close-btn" data-acao="fechar-chat" aria-label="Fechar o assistente">' + ic('x', 18) + '</button></div>' +

      '<div class="chat-body" id="chat-body">' + mensagens + digitando + sugestoes + '</div>' +

      '<form class="chat-input-area" data-form="chat">' +
        '<input class="chat-input" id="chat-input" placeholder="Digite sua dúvida..." autocomplete="off" />' +
        '<button class="chat-send-btn" type="submit" aria-label="Enviar">' + ic('send', 18) + '</button>' +
      '</form>' +
    '</div>' +
    '<button class="chatbot-fab" data-acao="fechar-chat" aria-label="Fechar o assistente">' + ic('x', 26) + '</button>';

  const corpo = document.getElementById('chat-body');
  if (corpo) corpo.scrollTop = corpo.scrollHeight;
}

function enviarPergunta(texto) {
  const limpo = (texto || '').trim();
  if (!limpo || estado.chatDigitando) return;
  estado.chatMensagens.push({ texto: limpo, de: 'user' });
  estado.chatDigitando = true;
  renderChatbot(rotaAtual());
  setTimeout(function () {
    estado.chatMensagens.push({ texto: buscarNaBase(limpo) || RESPOSTA_FALLBACK, de: 'bot' });
    estado.chatDigitando = false;
    renderChatbot(rotaAtual());
    const campo = document.getElementById('chat-input');
    if (campo) campo.focus();
  }, 900);
}

/* --- Roteador --- */

function rotaAtual() {
  const bruta = location.hash.replace(/^#/, '');
  return bruta || '/';
}

function ir(rota) {
  if (rotaAtual() !== rota) pilha.push(rotaAtual());
  estado.menuAberto = false;
  estado.erroTela = null;
  location.hash = '#' + rota;
}

function voltar(destino) {
  if (destino) { ir(destino); return; }
  const anterior = pilha.pop();
  location.hash = '#' + (anterior || '/dashboard');
}

const ROTAS = {
  '/': telaLogin,
  '/cadastro': telaCadastro,
  '/dashboard': telaDashboard,
  '/patient': telaMinhaSaude,
  '/profile': telaPerfil,
  '/record': telaProntuario,
  '/exams': telaExames,
  '/appointment': telaConsultas,
  '/dependentes': telaDependentes,
  '/vacinas': telaVacinas,
  '/rede-saude': telaRedeSaude,
  '/acesso-medico': telaAcessoMedico,
  '/acessos-log': telaHistoricoAcessos,
  '/medico': telaPortalMedico,
  '/terms': telaTermos,
  '/privacy': telaPrivacidade,
  '/faq': telaFaq,
};

const LIVRES = ['/', '/cadastro', '/medico'];

// Desenha a tela da rota atual. `manterRolagem` é usado quando só o estado
// mudou (olhinho, aba, filtro) e a página não deve pular para o topo.
function render(manterRolagem) {
  let rota = rotaAtual();

  // Sem sessão, só as telas livres abrem — como no app, que exige o JWT.
  if (LIVRES.indexOf(rota) === -1 && !estado.autenticado) {
    location.hash = '#/';
    return;
  }

  const conteudo = document.getElementById('conteudo');
  const rolagem = conteudo.scrollTop;

  const detalhe = rota.match(/^\/appointment\/(\d+)$/);
  const html = detalhe ? telaConsulta(detalhe[1]) : (ROTAS[rota] || telaDashboard)();

  conteudo.innerHTML = html;
  conteudo.scrollTop = manterRolagem ? rolagem : 0;

  renderBarra(rota);
  renderChatbot(rota);
}

/* --- Cliques (delegação num só ouvinte) --- */

document.addEventListener('click', function (evento) {
  const alvo = evento.target.closest('[data-ir],[data-voltar],[data-acao],[data-aba-exames],' +
    '[data-faq],[data-filtro-rede],[data-pessoa-vacina],[data-escopo],[data-revogar],' +
    '[data-remover-dependente],[data-sugestao],[data-aba-medico]');

  // Clicar fora fecha o menu "Mais".
  if (!alvo || (!alvo.dataset.acao && alvo.dataset.acao !== 'menu')) {
    if (estado.menuAberto && !evento.target.closest('.bottom-nav')) {
      estado.menuAberto = false;
      renderBarra(rotaAtual());
    }
  }
  if (!alvo) return;

  const d = alvo.dataset;

  if (d.ir !== undefined) { ir(d.ir); return; }
  if (d.voltar !== undefined) { voltar(d.voltar); return; }
  if (d.abaExames) { estado.abaExames = d.abaExames; render(false); return; }
  if (d.abaMedico) { estado.abaMedico = d.abaMedico; render(true); return; }
  if (d.filtroRede) { estado.filtroRede = d.filtroRede; render(true); return; }
  if (d.pessoaVacina) { estado.pessoaVacina = d.pessoaVacina; render(false); return; }
  if (d.escopo) { estado.escopoAcesso = d.escopo; render(true); return; }
  if (d.faq) { estado.faqAberta = estado.faqAberta === d.faq ? null : d.faq; render(true); return; }
  if (d.sugestao) { enviarPergunta(d.sugestao); return; }

  if (d.removerDependente) {
    estado.dependentes = estado.dependentes.filter(function (x) { return String(x.id) !== d.removerDependente; });
    if (String(estado.pessoaVacina) === d.removerDependente) estado.pessoaVacina = 'titular';
    render(true);
    return;
  }

  if (d.revogar) {
    estado.acessos = estado.acessos.map(function (a) {
      return String(a.id) === d.revogar ? Object.assign({}, a, { revogadoEm: new Date().toISOString() }) : a;
    });
    if (estado.codigoNovo && String(estado.codigoNovo.id) === d.revogar) estado.codigoNovo = null;
    // Revogar corta o acesso na hora, mesmo com o médico de tela aberta.
    if (estado.medico && String(estado.medico.id) === d.revogar) estado.medico = null;
    render(true);
    return;
  }

  switch (d.acao) {
    case 'menu':
      estado.menuAberto = !estado.menuAberto;
      renderBarra(rotaAtual());
      break;

    case 'olhinho':
      estado.oculto = !estado.oculto;
      render(true);
      break;

    case 'ver-senha': {
      const campo = document.getElementById('login-senha');
      const mostrar = campo.type === 'password';
      campo.type = mostrar ? 'text' : 'password';
      alvo.innerHTML = ic(mostrar ? 'eyeOff' : 'eye', 20);
      break;
    }

    case 'sem-senha':
      avisar('A redefinição de senha ainda não existe no app — o botão é decorativo também no original.');
      break;

    case 'biometria':
      avisar('A biometria depende do aparelho e não faz parte da demonstração.');
      break;

    case 'pdf':
      avisar('No app completo este botão baixa um PDF protegido pelos 4 primeiros dígitos do seu CPF.');
      break;

    case 'mapa':
      avisar('No app completo, "Como chegar" abre a rota no aplicativo de mapas do aparelho.');
      break;

    case 'ligar':
      avisar('No app completo, "Ligar" abre o discador do celular com o número da unidade.');
      break;

    case 'remarcar':
      avisar('O reagendamento ainda não existe no app — a tela de consultas só lista os atendimentos.');
      break;

    case 'mais-resultado':
      avisar('No app completo este botão acrescenta mais uma linha de resultado à coleta.');
      break;

    case 'gerar-codigo': {
      // Seis caracteres, sem as letras e os números que se confundem à mão.
      const alfabeto = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let codigo = '';
      for (let i = 0; i < 6; i++) codigo += alfabeto[Math.floor(Math.random() * alfabeto.length)];
      const id = Date.now();
      const expiraEm = new Date(Date.now() + 30 * 60000).toISOString();
      estado.codigoNovo = { id: id, codigo: codigo, escopo: estado.escopoAcesso, expiraEm: expiraEm };
      estado.acessos = [{
        id: id, medico: null, crm: null, escopo: estado.escopoAcesso,
        criadoEm: new Date().toISOString(), usadoEm: null, expiraEm: expiraEm, revogadoEm: null,
      }].concat(estado.acessos);
      render(false);
      break;
    }

    case 'copiar-codigo':
      if (estado.codigoNovo && navigator.clipboard) {
        navigator.clipboard.writeText(estado.codigoNovo.codigo).then(
          function () { avisar('Código copiado.'); },
          function () { avisar('Não foi possível copiar. Anote o código da tela.'); }
        );
      } else {
        avisar('Não foi possível copiar. Anote o código da tela.');
      }
      break;

    case 'abrir-chat':
      estado.chatAberto = true;
      renderChatbot(rotaAtual());
      break;

    case 'fechar-chat':
      estado.chatAberto = false;
      renderChatbot(rotaAtual());
      break;

    case 'medico-sair':
      estado.medico = null;
      estado.erroTela = null;
      render(false);
      break;

    case 'sair':
      // Sair de verdade: a sessão e os dados da demonstração voltam ao início.
      estado.autenticado = false;
      estado.menuAberto = false;
      estado.oculto = false;
      estado.chatAberto = false;
      estado.medico = null;
      estado.codigoNovo = null;
      location.hash = '#/';
      break;
  }
});

/* --- Formulários --- */

document.addEventListener('submit', function (evento) {
  const form = evento.target.closest('[data-form]');
  if (!form) return;
  evento.preventDefault();

  switch (form.dataset.form) {
    case 'login':
      estado.autenticado = true;
      ir('/dashboard');
      break;

    case 'cadastro':
      estado.autenticado = true;
      avisar('Cadastro simulado: nada foi gravado. Você entrou na conta de exemplo.');
      ir('/dashboard');
      break;

    case 'dependente': {
      const dados = new FormData(form);
      const cpf = String(dados.get('cpf') || '').replace(/\D/g, '');
      if (cpf.length !== 11) {
        estado.erroTela = 'O CPF deve ter exatamente 11 dígitos numéricos!';
        render(true);
        return;
      }
      estado.erroTela = null;
      estado.dependentes = estado.dependentes.concat([{
        id: Date.now(),
        nome: dados.get('nome'),
        cpf: cpf,
        data_nascimento: dados.get('nascimento'),
        genero: dados.get('genero'),
        tipo_sanguineo: dados.get('sangue'),
      }]);
      render(true);
      break;
    }

    case 'medico-entrar': {
      const dados = new FormData(form);
      const codigo = String(dados.get('codigo') || '').trim();
      if (codigo.length !== 6) {
        estado.erroTela = 'Código inválido ou expirado.';
        render(false);
        return;
      }
      // O escopo vem do código que o paciente gerou; sem código na mão, a
      // demonstração abre o acesso completo para dar para ver os dois lados.
      const gerado = estado.codigoNovo && estado.codigoNovo.codigo === codigo.toUpperCase()
        ? estado.codigoNovo : null;
      estado.erroTela = null;
      estado.medico = {
        id: gerado ? gerado.id : null,
        escopo: gerado ? gerado.escopo : 'escrita',
        expiraEm: new Date(Date.now() + 30 * 60000).toISOString(),
      };
      if (gerado) {
        estado.acessos = estado.acessos.map(function (a) {
          return a.id === gerado.id
            ? Object.assign({}, a, { medico: dados.get('nome'), crm: dados.get('crm'), usadoEm: new Date().toISOString() })
            : a;
        });
      }
      render(false);
      break;
    }

    case 'medico-consulta':
      avisar('Consulta registrada na demonstração — nada foi gravado no prontuário.');
      form.reset();
      break;

    case 'medico-exame':
      avisar('Coleta registrada na demonstração — nada foi gravado no prontuário.');
      form.reset();
      break;

    case 'chat': {
      const campo = document.getElementById('chat-input');
      const texto = campo.value;
      campo.value = '';
      enviarPergunta(texto);
      break;
    }
  }
});

/* --- Contagem regressiva dos acessos temporários --- */
// Atualiza só o texto do relógio: recarregar a tela inteira a cada segundo
// atrapalharia quem estivesse preenchendo o formulário do médico.
setInterval(function () {
  const doCodigo = document.getElementById('timer-codigo');
  if (doCodigo && estado.codigoNovo) {
    const restante = tempoRestante(estado.codigoNovo.expiraEm);
    if (restante) doCodigo.textContent = restante;
    else render(true);
  }
  const daSessao = document.getElementById('timer-sessao');
  if (daSessao && estado.medico) {
    const restante = tempoRestante(estado.medico.expiraEm);
    if (restante) daSessao.textContent = restante;
    else render(true);
  }
}, 1000);

window.addEventListener('hashchange', function () { render(false); });

if (!location.hash) location.hash = '#/';
render(false);
</script>
